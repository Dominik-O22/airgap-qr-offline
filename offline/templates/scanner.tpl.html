<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR File Receiver (offline)</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; color: #333; }
      .card { max-width: 640px; margin: 0 auto; padding: 20px; background: #fff;
              min-height: 100vh; display: flex; flex-direction: column; align-items: center;
              box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
      .title { font-size: 1.25rem; margin: 1rem 0; }
      .message { font-size: 0.9rem; margin: 0 0 1rem; color: #555; text-align: center; }
      button { padding: 8px 16px; border: 2px solid #6b7280; background: #fff;
               cursor: pointer; font-size: 1rem; margin: 0 0 1rem; }
      button:hover { background: #e5e7eb; }
      video, canvas { width: 100%; border: 1px solid #ddd; background: #000; margin: 0 0 1rem; }
      select { font-size: 1rem; margin: 0 0 1rem; max-width: 100%; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Data Receiver Mode</div>
      <div class="message" id="user_message">Click receive button to start receiving</div>
      <div class="message" id="progress">Progress: 0 / 0</div>
      <button id="btn">Start Receiver</button>
      <button id="btn_window">Capture a Window</button>
      <select id="camera" hidden></select>
      <div class="message" id="stats"></div>
      <canvas id="scan"></canvas>
      <video id="video" muted autoplay playsinline></video>
    </div>

    <script>
      (function () {
        var user_message = document.getElementById("user_message");
        var progress = document.getElementById("progress");
        var btn = document.getElementById("btn");
        var btn_window = document.getElementById("btn_window");
        var video = document.getElementById("video");
        var scan = document.getElementById("scan");
        var camera = document.getElementById("camera");
        var stats = document.getElementById("stats");

        var is_receiving = false, stream = null, timer = null;
        var can_capture_window = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);

        // The transfer being collected, and the last frame id seen (each code
        // usually shows up in more than one camera frame).
        var decoder = null, last_frame = -1;
        // A frame from a different transfer only replaces the current one
        // after this many arrive in a row, so one stray code cannot wipe it.
        var SWITCH_AFTER = 3;
        var rival_key = "", rival_count = 0;

        // Region of the video frame holding the QR code, in video pixels. Set
        // once a code is found so later frames decode only that region,
        // enlarged; null means the whole frame is searched.
        var roi = null, roi_misses = 0, searches = 0;
        var ROI_MARGIN_MODULES = 6; // padding around the code: its quiet zone and then some,
        var ROI_MARGIN = 0.05;      // plus this fraction of its size as room to move
        var ROI_MODULE_PX = 5;      // the region is scaled to this many pixels per QR module
        var ROI_MAX_ZOOM = 4;
        var ROI_MIN_ZOOM = 0.25;
        var ROI_MAX_MISSES = 8;     // unreadable frames before searching the whole frame again
        // Whole-frame searches alternate between these scales, since a dense
        // code can be too fine to read (and so to locate) at camera resolution.
        var SEARCH_ZOOMS = [1, 2];
        var SEARCH_MAX_WIDTH = 2560;

        var safe_filename = function (name) {
          var n = String(name || "").split(/[\\/]/).pop();
          n = n.replace(/[\u0000-\u001f\u007f]/g, "").trim();
          if (n === "." || n === "..") n = "";
          if (n.length > 200) n = n.slice(0, 200);
          return n || "received_file.bin";
        };

        var download_file = function (data, fileName) {
          var blob = new Blob([data]);
          var a = document.createElement("a");
          var url = URL.createObjectURL(blob);
          a.href = url;
          a.download = fileName;
          a.click();
          setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
        };

        var render = function () {
          progress.textContent = "Progress: " + (decoder ? decoder.rank() : 0) +
            " / " + (decoder ? decoder.chunks : 0);
          user_message.textContent = decoder
            ? "Receiving " + Math.ceil(decoder.size / 1024) + " KB"
            : is_receiving ? "Looking for a QR code"
                           : "Click receive button to start receiving";
          btn.textContent = is_receiving ? "Stop Receiver" : "Start Receiver";
          btn_window.hidden = is_receiving || !can_capture_window;
        };

        var next_frame = function () {
          timer = video.requestVideoFrameCallback
            ? video.requestVideoFrameCallback(scan_frame)
            : requestAnimationFrame(scan_frame);
        };

        var stop_camera = function () {
          if (video.cancelVideoFrameCallback) video.cancelVideoFrameCallback(timer);
          else cancelAnimationFrame(timer);
          if (stream) {
            stream.getTracks().forEach(function (t) { t.stop(); });
            stream = null;
          }
          video.srcObject = null;
          camera.hidden = true;
          roi = null;
          stats.textContent = "";
        };

        // Square region around a decoded code's corners, mapped from scan
        // canvas pixels back to video pixels and padded so the code stays
        // inside it if the camera moves a little. `zoom` scales the region so
        // each of the code's modules covers ROI_MODULE_PX pixels.
        var region_around = function (code, src, zoom) {
          var loc = code.location, modules = 17 + 4 * (code.version || 1);
          var pts = [loc.topLeftCorner, loc.topRightCorner, loc.bottomLeftCorner, loc.bottomRightCorner];
          var xs = pts.map(function (p) { return src.x + p.x / zoom; });
          var ys = pts.map(function (p) { return src.y + p.y / zoom; });
          var side = Math.max(Math.max.apply(null, xs) - Math.min.apply(null, xs),
                              Math.max.apply(null, ys) - Math.min.apply(null, ys));
          var pad = side * (ROI_MARGIN_MODULES / modules + ROI_MARGIN);
          var x0 = Math.max(0, Math.floor(Math.min.apply(null, xs) - pad));
          var y0 = Math.max(0, Math.floor(Math.min.apply(null, ys) - pad));
          var x1 = Math.min(video.videoWidth, Math.ceil(Math.max.apply(null, xs) + pad));
          var y1 = Math.min(video.videoHeight, Math.ceil(Math.max.apply(null, ys) + pad));
          return { x: x0, y: y0, w: x1 - x0, h: y1 - y0,
                   zoom: Math.min(ROI_MAX_ZOOM, Math.max(ROI_MIN_ZOOM, ROI_MODULE_PX * modules / side)) };
        };

        // Decodes the current video frame and returns the QR code's bytes, or
        // null. With a tracked region only that part is decoded, scaled so
        // small or dense codes still have several pixels per module.
        var decode_frame = function () {
          var src = roi || { x: 0, y: 0, w: video.videoWidth, h: video.videoHeight };
          var zoom = roi ? roi.zoom
            : Math.min(SEARCH_ZOOMS[searches++ % SEARCH_ZOOMS.length], SEARCH_MAX_WIDTH / src.w);
          scan.width = Math.round(src.w * zoom);
          scan.height = Math.round(src.h * zoom);
          var ctx = scan.getContext("2d", { willReadFrequently: true });
          ctx.drawImage(video, src.x, src.y, src.w, src.h, 0, 0, scan.width, scan.height);
          var image = ctx.getImageData(0, 0, scan.width, scan.height);
          var started = Date.now();
          var code = jsQR(image.data, scan.width, scan.height, { inversionAttempts: "dontInvert" });
          stats.textContent = "Video " + video.videoWidth + "x" + video.videoHeight +
            (roi ? ", tracking code at " : ", searching whole frame at ") + zoom.toFixed(1) + "x" +
            ", decode " + (Date.now() - started) + "ms";
          if (!code) {
            if (roi && ++roi_misses >= ROI_MAX_MISSES) roi = null;
            return null;
          }
          roi_misses = 0;
          if (code.location) roi = region_around(code, src, zoom);
          return code.binaryData;
        };

        var complete = function () {
          var failed = null, name = "";
          try {
            var file = AirgapCodec.unpack(decoder.blob());
            name = safe_filename(file.name);
            download_file(file.bytes, name);
          } catch (e) {
            failed = e;
          }
          stop_receiving();
          user_message.textContent = failed
            ? "Transfer failed: " + (failed.message || String(failed))
            : "Received \"" + name + "\"";
        };

        // Feeds one decoded QR payload to the current transfer.
        var accept = function (bytes) {
          var f = AirgapCodec.parse(bytes);
          if (!f) {
            if (!decoder) {
              user_message.textContent = "Found a QR code, but not one from this sender. " +
                "If the sender page is an older version, reload it.";
            }
            return;
          }
          if (decoder && decoder.key !== f.key) {
            rival_count = f.key === rival_key ? rival_count + 1 : 1;
            rival_key = f.key;
            if (rival_count < SWITCH_AFTER) return;
            decoder = null;
          }
          rival_count = 0;
          if (!decoder) {
            decoder = AirgapCodec.decoder(f);
            last_frame = -1;
          }
          if (f.frame === last_frame) return;
          last_frame = f.frame;
          decoder.add(f);
          render();
        };

        var scan_frame = function () {
          if (!is_receiving) return;
          try {
            if (video.videoWidth > 0 && video.videoHeight > 0) {
              var bytes = decode_frame();
              if (bytes) accept(bytes);
              if (decoder && decoder.rank() >= decoder.chunks) {
                complete();
                return;
              }
            }
          } catch (e) {
            /* skip unreadable frame */
          }
          next_frame();
        };

        // Starts scanning a newly opened stream, replacing the current one.
        var use_stream = function (s) {
          if (!is_receiving) { s.getTracks().forEach(function (t) { t.stop(); }); return false; }
          stop_camera();
          stream = s;
          video.srcObject = s;
          scan_frame();
          return true;
        };

        // Opens the chosen camera (or the rear-facing default) at the highest
        // resolution it offers up to 1080p; browsers default to 640x480.
        var open_camera = function (device_id) {
          var want = { width: { ideal: 1920 }, height: { ideal: 1080 } };
          if (device_id) want.deviceId = { exact: device_id };
          else want.facingMode = "environment";
          return navigator.mediaDevices.getUserMedia({ video: want }).then(function (s) {
            if (use_stream(s)) list_cameras();
          });
        };

        // Scans a window or screen of this machine instead of a camera, e.g.
        // a remote desktop client showing the sender. The browser asks which.
        var open_window = function () {
          return navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30 } } })
            .then(function (s) {
              if (!use_stream(s)) return;
              // sharing ended from the browser's own controls
              s.getVideoTracks()[0].addEventListener("ended", function () {
                if (stream === s) stop_receiving();
              });
            });
        };

        // Fills the camera picker. Labels are only available once camera
        // permission has been granted, so this runs after a stream opens.
        var list_cameras = function () {
          if (!navigator.mediaDevices.enumerateDevices) return;
          var track = stream.getVideoTracks()[0];
          var current = track ? track.getSettings().deviceId : "";
          navigator.mediaDevices.enumerateDevices().then(function (devices) {
            var cams = devices.filter(function (d) { return d.kind === "videoinput"; });
            camera.textContent = "";
            cams.forEach(function (d, i) {
              var opt = document.createElement("option");
              opt.value = d.deviceId;
              opt.textContent = d.label || "Camera " + (i + 1);
              opt.selected = d.deviceId === current;
              camera.appendChild(opt);
            });
            camera.hidden = cams.length < 2;
          });
        };

        var source_failed = function (e) {
          stop_receiving();
          user_message.textContent = "Video error: " + e.message;
        };

        // Switching cameras mid-transfer keeps the chunks received so far.
        camera.addEventListener("change", function () {
          if (is_receiving) open_camera(camera.value).catch(source_failed);
        });

        var stop_receiving = function () {
          is_receiving = false;
          stop_camera();
          decoder = null;
          render();
        };

        // Begins a fresh transfer from the stream that `open` resolves to.
        var start_receiving = function (open) {
          is_receiving = true;
          decoder = null;
          render();
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            stop_receiving();
            user_message.textContent =
              "Camera unavailable: this page must be opened from a secure context " +
              "(e.g. http://localhost) to access the camera.";
            return;
          }
          open().catch(source_failed);
        };

        btn.addEventListener("click", function () {
          if (is_receiving) stop_receiving();
          else start_receiving(function () { return open_camera(camera.value); });
        });
        btn_window.addEventListener("click", function () { start_receiving(open_window); });

        render();
      })();
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      }
    </script>
  </body>
</html>
