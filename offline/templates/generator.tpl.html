<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR File Sender (offline)</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; color: #333; }
      .card { max-width: 640px; margin: 0 auto; padding: 20px; background: #fff;
              display: flex; flex-direction: column; align-items: center;
              box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
      .title { font-size: 1.25rem; margin: 1rem 0; }
      .message { font-size: 0.9rem; margin: 0 0 1rem; color: #555; text-align: center; }
      input[type="file"] { width: 100%; padding: 8px; margin: 0 0 1rem;
                           border: 1px solid #d1d5db; background: #f9fafb; cursor: pointer; }
      textarea { width: 100%; padding: 8px; margin: 0 0 1rem;
                 border: 1px solid #d1d5db; background: #f9fafb;
                 font: inherit; color: #333; resize: vertical; }
      input[type="file"]:disabled, textarea:disabled {
        opacity: 0.5; cursor: not-allowed; }
      .row { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 0 0 1rem; }
      label.row { font-size: 0.9rem; }
      select { padding: 4px 6px; }
      button { padding: 8px 16px; border: 2px solid #6b7280; background: #fff;
               cursor: pointer; font-size: 1rem; }
      button:hover:not(:disabled) { background: #e5e7eb; }
      button:disabled { opacity: 0.5; cursor: default; }
      #qrcode { display: block; margin: 8px auto; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Data Sender Mode</div>
      <div class="message" id="user_message">Choose a file or paste text to get started</div>
      <input id="file_input" type="file" />
      <textarea id="text_input" rows="5"
        placeholder="Or paste text to send as a file (takes priority over the selected file)"></textarea>
      <div class="row">
        <button id="btn_start">Start Transfer</button>
        <button id="btn_prev" disabled>Prev</button>
        <button id="btn_next" disabled>Next</button>
      </div>
      <label class="row">
        Speed:
        <select id="speed">
          <option value="2000">Slow (2s per code)</option>
          <option value="1000">Normal (1s per code)</option>
          <option value="250" selected>Fast (0.25s per code)</option>
          <option value="100">Faster (0.1s per code)</option>
          <option value="50">Fastest (0.05s per code)</option>
        </select>
      </label>
      <label class="row">
        Code size:
        <select id="density">
          <option value="367">Small (0.4 KB per code)</option>
          <option value="718">Medium (0.7 KB per code)</option>
          <option value="1273" selected>Large (1.3 KB per code)</option>
          <option value="1732">Very large (1.7 KB per code)</option>
          <option value="2953">Maximum (2.9 KB per code)</option>
        </select>
      </label>
    </div>
    <canvas id="qrcode" width="0" height="0"></canvas>

    <script>
      (function () {
        var user_message = document.getElementById("user_message");
        var btn_start = document.getElementById("btn_start");
        var btn_prev = document.getElementById("btn_prev");
        var btn_next = document.getElementById("btn_next");
        var file_input = document.getElementById("file_input");
        var text_input = document.getElementById("text_input");
        var speed = document.getElementById("speed");
        var density = document.getElementById("density");
        var canvas = document.getElementById("qrcode");
        var MAX_TEXT_LENGTH = 1000000;
        var QUIET = 4; // white modules around the code, so it scans on any page background

        // `pos` counts the codes shown so far; frame_id() maps it to a frame.
        var is_transferring = false, blob = null, enc = null, pos = 0, timer = null;
        var current_name = "";

        var paste_name = function () {
          var pad2 = function (n) { return ("0" + n).slice(-2); };
          var d = new Date();
          return "Paste @ " + d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) +
                 "_" + pad2(d.getHours()) + "-" + pad2(d.getMinutes()) + "-" + pad2(d.getSeconds());
        };

        var sync_input_states = function () {
          var has_text = text_input.value.trim() !== "";
          var has_file = file_input.files.length > 0;
          if (has_text) {
            file_input.value = "";
            has_file = false;
          }
          file_input.disabled = has_text;
          text_input.disabled = has_file;
        };
        text_input.addEventListener("input", sync_input_states);
        file_input.addEventListener("change", sync_input_states);

        var safe_name = function (name) {
          var n = String(name || "").split(/[\\/]/).pop();
          n = n.replace(/[\u0000-\u001f\u007f]/g, "").trim();
          if (n === "." || n === "..") n = "";
          if (n.length > 200) n = n.slice(0, 200);
          return n || "file.bin";
        };

        var valid_text = function (text) {
          if (typeof text !== "string" || text.length === 0) {
            return { ok: false, error: "Text is empty" };
          }
          if (text.length > MAX_TEXT_LENGTH) {
            return { ok: false,
                     error: "Text too long: " + text.length +
                            " characters (max " + MAX_TEXT_LENGTH + ")" };
          }
          for (var i = 0; i < text.length; i++) {
            var c = text.charCodeAt(i);
            if (c >= 0xd800 && c <= 0xdfff) {
              if (c <= 0xdbff) {
                if (i + 1 >= text.length) {
                  return { ok: false, error: "Text contains an unpaired surrogate" };
                }
                var next = text.charCodeAt(i + 1);
                if (!(next >= 0xdc00 && next <= 0xdfff)) {
                  return { ok: false, error: "Text contains invalid Unicode characters" };
                }
                i++;
              } else {
                return { ok: false, error: "Text contains invalid Unicode characters" };
              }
            }
          }
          return { ok: true };
        };

        // Extra repair frames sent after each pass over the chunks.
        var repair_count = function () {
          return Math.ceil(enc.chunks / 8) + (enc.chunks > 1 ? 4 : 0);
        };

        // The sender loops: every chunk in order, then a batch of repair
        // frames. Repair frame ids keep increasing, so each loop sends new ones.
        var frame_id = function (p) {
          var k = enc.chunks, r = repair_count();
          var loop = Math.floor(p / (k + r)), offset = p % (k + r);
          return offset < k ? offset : k + loop * r + (offset - k);
        };

        // Draws one frame as a byte-mode QR code at a whole number of device
        // pixels per module, as large as the window allows.
        var draw = function (bytes) {
          var qr = qrcode(0, "L");
          qr.addData(String.fromCharCode.apply(null, bytes), "Byte");
          qr.make();
          var n = qr.getModuleCount(), total = n + 2 * QUIET;
          var dpr = window.devicePixelRatio || 1;
          var side = (Math.min(window.innerWidth, window.innerHeight) - 16) * dpr;
          var cell = Math.max(1, Math.floor(side / total));
          canvas.width = canvas.height = total * cell;
          canvas.style.width = canvas.style.height = (total * cell / dpr) + "px";
          var ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#000000";
          for (var row = 0; row < n; row++) {
            for (var col = 0; col < n; col++) {
              if (qr.isDark(row, col)) {
                ctx.fillRect((col + QUIET) * cell, (row + QUIET) * cell, cell, cell);
              }
            }
          }
        };

        var show = function (p) {
          pos = Math.max(0, p);
          var id = frame_id(pos);
          draw(enc.frame(id));
          user_message.textContent = "Sending \"" + current_name + "\": " +
            (id < enc.chunks ? "chunk " + (id + 1) + " of " + enc.chunks
                             : "repair code for " + enc.chunks + " chunks");
        };

        var schedule = function () {
          clearTimeout(timer);
          timer = setTimeout(function () {
            if (is_transferring) {
              show(pos + 1);
              schedule();
            }
          }, parseInt(speed.value, 10));
        };

        var stop_transfer = function () {
          is_transferring = false;
          clearTimeout(timer);
          btn_start.textContent = "Start Transfer";
          btn_prev.disabled = true;
          btn_next.disabled = true;
          user_message.textContent = "Choose a file or paste text to get started";
        };

        var start_encoder = function () {
          enc = AirgapCodec.encoder(blob, parseInt(density.value, 10));
          if (enc.chunks > AirgapCodec.MAX_CHUNKS) {
            user_message.textContent = "File needs too many codes, pick a larger code size";
            return false;
          }
          return true;
        };

        var begin_transfer = function (bytes, name) {
          current_name = safe_name(name);
          blob = AirgapCodec.pack(current_name, bytes);
          if (blob.length > AirgapCodec.MAX_SIZE) {
            user_message.textContent = "File too large: " + blob.length +
              " bytes compressed (max " + AirgapCodec.MAX_SIZE + ")";
            return;
          }
          if (!start_encoder()) return;
          is_transferring = true;
          btn_start.textContent = "Stop Transfer";
          btn_prev.disabled = false;
          btn_next.disabled = false;
          show(0);
          schedule();
        };

        var start_transfer = function () {
          if (is_transferring) { stop_transfer(); return; }
          var text = text_input.value;
          if (text.trim() !== "") {
            var check = valid_text(text);
            if (!check.ok) { user_message.textContent = check.error; return; }
            var bytes = new TextEncoder().encode(text);
            begin_transfer(bytes, paste_name());
            return;
          }
          var file = file_input.files[0];
          if (!file) {
            user_message.textContent = "Choose a file or paste text to get started";
            return;
          }
          file.arrayBuffer().then(function (buf) {
            begin_transfer(new Uint8Array(buf), file.name);
          });
        };

        btn_start.addEventListener("click", start_transfer);
        btn_prev.addEventListener("click", function () { show(pos - 1); schedule(); });
        btn_next.addEventListener("click", function () { show(pos + 1); schedule(); });
        speed.addEventListener("change", schedule);
        // A new code size is a new transfer as far as the receiver is concerned.
        density.addEventListener("change", function () {
          if (!is_transferring) return;
          if (!start_encoder()) { stop_transfer(); return; }
          show(0);
          schedule();
        });

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        }
      })();
    </script>
  </body>
</html>
